{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block page_title %}Alterar senha{% endblock %}
{% block content %}
<section class="content-narrow">
  <div class="surface-card form-card">
    <p class="section-kicker">Segurança da conta</p>
    <h2>Defina uma nova senha</h2>
    <form method="post" novalidate>{% csrf_token %}
      {% include "shared/form_fields.html" with form=form %}
      <div class="form-actions"><a class="btn-app btn-ghost" href="/">Cancelar</a><button class="btn-app btn-primary-app">Salvar nova senha</button></div>
    </form>
  </div>
</section>
{% endblock %}
