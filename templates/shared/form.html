{% extends "base.html" %}
{% block title %}{{ titulo }} — Gestão Rural{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}
{% block content %}
<section class="content-narrow">
  <div class="surface-card form-card">
    {% if subtitulo %}<p class="section-kicker">{{ subtitulo }}</p>{% endif %}
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "shared/form_fields.html" with form=form %}
      <div class="form-actions">
        <a class="btn-app btn-ghost" href="{% if voltar_url %}{{ voltar_url }}{% else %}{% url 'core:dashboard' %}{% endif %}">Cancelar</a>
        <button class="btn-app btn-primary-app" type="submit">{{ texto_botao|default:'Salvar' }}</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
